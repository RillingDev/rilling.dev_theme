{% extends "index.html" %}

{% block title %}
{{ page.title }} | {{ config.title }}
{% endblock title %}

{% block open_graph %}
{{ super() }}
<meta property="article:published_time" content="{{ page.date | date(format='%F') }}">
<meta property="article:modified_time" content="{{ page.updated | date(format='%F') }}">
<meta property="article:author" content="{{ config.author }}">
<meta property="article:tag" content="{{ page.extra.tags | join(sep=', ') }}">
{% endblock open_graph %}

{% block main %}
<article class="article article--full">
    <header>
        <h1 class="article__title">{{ page.title }}</h1>
        <div class="article__meta">{{ <page.meta page={page} /> }}</div>
    </header>
    <div class="article__content">
        {{ page.content | safe }}
    </div>
</article>
{% endblock main %}
